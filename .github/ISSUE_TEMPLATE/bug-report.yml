name: Bug Report
description: Report a bug or unexpected behavior in LLMxRay
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the fields below to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: ollama-version
    attributes:
      label: Ollama Version
      placeholder: "e.g., 0.6.2"

  - type: input
    id: model
    attributes:
      label: Model Used
      placeholder: "e.g., llama3.2:latest"

  - type: input
    id: llmxray-version
    attributes:
      label: LLMxRay Version
      placeholder: "e.g., 0.2.1"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the issue.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information that might be relevant.
