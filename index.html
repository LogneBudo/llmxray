<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LLMxRay is a local LLM observatory that captures, visualizes and analyzes traffic from AI models like ChatGPT, Claude, Ollama and more — entirely on your machine." />
    <title>LLMxRay — Local LLM Observatory</title>
  </head>
  <body>
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        var theme = localStorage.getItem('llmxray-theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.className = isDark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
