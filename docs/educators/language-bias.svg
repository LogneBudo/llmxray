<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Tokenizer Language Bias</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">Same meaning, different token counts across languages</text>

  <!-- Sentence -->
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#c084fc" font-style="italic">"The weather is beautiful today"</text>

  <!-- Chart area -->
  <g transform="translate(120, 115)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="250" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="250" x2="570" y2="250" stroke="#334155" stroke-width="1"/>

    <!-- Y labels -->
    <text x="-12" y="254" text-anchor="end" font-size="11" fill="#64748b">0</text>
    <text x="-12" y="192" text-anchor="end" font-size="11" fill="#64748b">5</text>
    <text x="-12" y="130" text-anchor="end" font-size="11" fill="#64748b">10</text>
    <text x="-12" y="68" text-anchor="end" font-size="11" fill="#64748b">15</text>
    <text x="-12" y="6" text-anchor="end" font-size="11" fill="#64748b">20</text>

    <!-- Grid -->
    <line x1="0" y1="192" x2="560" y2="192" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="0" y1="130" x2="560" y2="130" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="0" y1="68" x2="560" y2="68" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>

    <!-- Y axis title -->
    <text x="-50" y="125" text-anchor="middle" font-size="12" fill="#94a3b8" transform="rotate(-90, -50, 125)">Tokens</text>

    <!-- Bars with generous spacing -->

    <!-- English -->
    <rect x="25" y="192" width="55" height="58" rx="5" fill="#4ade80" opacity="0.85"/>
    <text x="52" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#4ade80">5</text>
    <text x="52" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#e2e8f0">English</text>
    <text x="52" y="296" text-anchor="middle" font-size="11" fill="#64748b">1.0x</text>

    <!-- French -->
    <rect x="115" y="168" width="55" height="82" rx="5" fill="#a855f7" opacity="0.85"/>
    <text x="142" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#a855f7">7</text>
    <text x="142" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#e2e8f0">French</text>
    <text x="142" y="296" text-anchor="middle" font-size="11" fill="#64748b">1.4x</text>

    <!-- German -->
    <rect x="205" y="156" width="55" height="94" rx="5" fill="#8b5cf6" opacity="0.85"/>
    <text x="232" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#8b5cf6">8</text>
    <text x="232" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#e2e8f0">German</text>
    <text x="232" y="296" text-anchor="middle" font-size="11" fill="#64748b">1.6x</text>

    <!-- Chinese -->
    <rect x="295" y="130" width="55" height="120" rx="5" fill="#7c3aed" opacity="0.85"/>
    <text x="322" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">10</text>
    <text x="322" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#e2e8f0">Chinese</text>
    <text x="322" y="296" text-anchor="middle" font-size="11" fill="#64748b">2.0x</text>

    <!-- Arabic -->
    <rect x="385" y="104" width="55" height="146" rx="5" fill="#6d28d9" opacity="0.85"/>
    <text x="412" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">12</text>
    <text x="412" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#e2e8f0">Arabic</text>
    <text x="412" y="296" text-anchor="middle" font-size="11" fill="#64748b">2.4x</text>

    <!-- Yoruba -->
    <rect x="475" y="28" width="55" height="222" rx="5" fill="#ef4444" opacity="0.75"/>
    <text x="502" y="18" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">18</text>
    <text x="502" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#e2e8f0">Yoruba</text>
    <text x="502" y="296" text-anchor="middle" font-size="11" fill="#64748b">3.6x</text>

    <!-- English baseline reference -->
    <line x1="25" y1="192" x2="540" y2="192" stroke="#4ade80" stroke-width="1" stroke-dasharray="6 3" opacity="0.4"/>
    <text x="555" y="196" font-size="10" fill="#4ade80" opacity="0.6">English</text>
    <text x="555" y="208" font-size="10" fill="#4ade80" opacity="0.6">baseline</text>
  </g>

  <!-- Bottom insight box - well below the labels -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="640" height="28" rx="6" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
    <text x="320" y="18" text-anchor="middle" font-size="12" fill="#f87171">Same meaning costs 3.6x more tokens in Yoruba than English — higher cost, slower, shorter context</text>
  </g>
</svg>
