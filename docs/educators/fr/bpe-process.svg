<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Comment fonctionne la tokenisation BPE</text>

  <!-- Step 1: Characters -->
  <text x="80" y="90" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">STEP 1</text>
  <text x="80" y="106" font-size="10" fill="#94a3b8" text-anchor="middle">Commencer par les caractères</text>

  <g transform="translate(20, 120)">
    <rect x="0" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="11" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">u</text>
    <rect x="26" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="37" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">n</text>
    <rect x="52" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="63" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">d</text>
    <rect x="78" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="89" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">e</text>
    <rect x="104" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="115" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">r</text>
    <rect x="130" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="141" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">s</text>
    <rect x="156" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="167" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">t</text>
    <rect x="182" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="193" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">a</text>
    <rect x="208" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="219" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">n</text>
    <rect x="234" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="245" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">d</text>
    <rect x="260" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="271" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">i</text>
    <rect x="286" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="297" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">n</text>
    <rect x="312" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="323" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">g</text>
    <text x="170" y="52" text-anchor="middle" font-size="11" fill="#64748b">13 tokens (un par caractère)</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(370, 136)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
    <polygon points="50,-5 60,0 50,5" fill="#a855f7" opacity="0.6"/>
    <text x="30" y="18" text-anchor="middle" font-size="9" fill="#c084fc">merge</text>
  </g>

  <!-- Step 2: First merges -->
  <text x="560" y="90" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">STEP 2</text>
  <text x="560" y="106" font-size="10" fill="#94a3b8" text-anchor="middle">Fusionner les paires fréquentes</text>

  <g transform="translate(440, 120)">
    <rect x="0" y="0" width="44" height="32" rx="4" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="22" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">un</text>
    <rect x="50" y="0" width="44" height="32" rx="4" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="72" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">de</text>
    <rect x="100" y="0" width="22" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="111" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">r</text>
    <rect x="128" y="0" width="44" height="32" rx="4" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="150" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">st</text>
    <rect x="178" y="0" width="44" height="32" rx="4" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="200" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">an</text>
    <rect x="228" y="0" width="44" height="32" rx="4" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="250" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">di</text>
    <rect x="278" y="0" width="44" height="32" rx="4" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="300" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">ng</text>
    <text x="155" y="52" text-anchor="middle" font-size="11" fill="#64748b">7 tokens (paires fusionnées)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 560,185 L 560,215 L 240,215 L 240,240" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a855f7" opacity="0.6"/></marker></defs>
  <text x="400" y="210" text-anchor="middle" font-size="9" fill="#c084fc">continue merging</text>

  <!-- Step 3: Final tokens -->
  <text x="240" y="260" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">STEP 3</text>
  <text x="240" y="276" font-size="10" fill="#94a3b8" text-anchor="middle">Tokens finaux du vocabulaire</text>

  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-width="2"/>
    <text x="40" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" font-family="'Courier New',monospace">under</text>

    <rect x="100" y="0" width="80" height="40" rx="6" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-width="2"/>
    <text x="140" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" font-family="'Courier New',monospace">stand</text>

    <rect x="200" y="0" width="60" height="40" rx="6" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-width="2"/>
    <text x="230" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" font-family="'Courier New',monospace">ing</text>

    <text x="130" y="60" text-anchor="middle" font-size="11" fill="#64748b">3 tokens (résultat final)</text>
  </g>

  <!-- Right side: the key insight -->
  <g transform="translate(480, 250)">
    <rect x="0" y="0" width="280" height="120" rx="12" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="140" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">Point Clé</text>
    <text x="140" y="52" text-anchor="middle" font-size="11" fill="#e2e8f0">Mots courants = moins de tokens</text>
    <text x="140" y="72" text-anchor="middle" font-size="11" fill="#e2e8f0">Mots rares = plus de tokens</text>
    <text x="140" y="96" text-anchor="middle" font-size="11" fill="#94a3b8">"the" = 1 token | "tokenization" = 3 tokens</text>
  </g>
</svg>