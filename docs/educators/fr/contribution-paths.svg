<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgContribFr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="350" rx="16" fill="url(#bgContribFr)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Trois voies de contribution</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">Chaque &#xe9;tudiant peut contribuer &#xe0; la communaut&#xe9;</text>

  <!-- Card 1: Benchmarks personnalis&#xe9;s (green) -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="235" height="220" rx="12" fill="rgba(74,222,128,0.06)" stroke="#4ade80" stroke-width="1.5"/>
    <!-- Clipboard icon -->
    <g transform="translate(16, 16)">
      <rect x="3" y="0" width="16" height="4" rx="2" fill="none" stroke="#4ade80" stroke-width="1.2"/>
      <rect x="0" y="3" width="22" height="22" rx="3" fill="none" stroke="#4ade80" stroke-width="1.2"/>
      <line x1="5" y1="11" x2="17" y2="11" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="16" x2="17" y2="16" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="21" x2="12" y2="21" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
    </g>
    <text x="48" y="32" font-size="13" font-weight="700" fill="#4ade80">Benchmarks personnalis&#xe9;s</text>
    <line x1="12" y1="46" x2="223" y2="46" stroke="#334155" stroke-width="0.5"/>

    <text x="118" y="68" text-anchor="middle" font-size="10" fill="#e2e8f0">Concevez 20+ questions</text>
    <text x="118" y="82" text-anchor="middle" font-size="10" fill="#e2e8f0">pour votre domaine</text>

    <rect x="16" y="96" width="203" height="24" rx="6" fill="rgba(74,222,128,0.08)"/>
    <text x="118" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Soumettez &#xe0; community-benchmarks/</text>

    <rect x="16" y="128" width="203" height="24" rx="6" fill="rgba(74,222,128,0.08)"/>
    <text x="118" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Format : JSON avec validation de sch&#xe9;ma</text>

    <!-- GitHub reference -->
    <g transform="translate(16, 168)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <path d="M7,14 Q7,11 8,10 Q6,10 6,8 Q6,6 7,5 Q7,4 8,4 Q9,3 10,3 Q11,3 12,4 Q13,4 13,5 Q14,6 14,8 Q14,10 12,10 Q13,11 13,14" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="25" y="14" font-size="9" fill="#94a3b8">Pull Request sur GitHub</text>
    </g>

    <!-- Effort indicator -->
    <text x="118" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#4ade80">Effort : Moyen &#x2022; Impact : &#xc9;lev&#xe9;</text>
  </g>

  <!-- Card 2: Outils personnalis&#xe9;s (purple) -->
  <g transform="translate(283, 65)">
    <rect x="0" y="0" width="235" height="220" rx="12" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Wrench/gear icon -->
    <g transform="translate(16, 16)">
      <circle cx="11" cy="11" r="7" fill="none" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="11" cy="11" r="3" fill="none" stroke="#a855f7" stroke-width="1.2"/>
      <line x1="11" y1="0" x2="11" y2="4" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
      <line x1="11" y1="18" x2="11" y2="22" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="11" x2="4" y2="11" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
      <line x1="18" y1="11" x2="22" y2="11" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#a855f7">Outils personnalis&#xe9;s</text>
    <line x1="12" y1="46" x2="223" y2="46" stroke="#334155" stroke-width="0.5"/>

    <text x="118" y="68" text-anchor="middle" font-size="10" fill="#e2e8f0">Construisez un outil qui</text>
    <text x="118" y="82" text-anchor="middle" font-size="10" fill="#e2e8f0">r&#xe9;sout un vrai probl&#xe8;me</text>

    <rect x="16" y="96" width="203" height="24" rx="6" fill="rgba(168,85,247,0.08)"/>
    <text x="118" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Soumettez &#xe0; community-tools/</text>

    <rect x="16" y="128" width="203" height="24" rx="6" fill="rgba(168,85,247,0.08)"/>
    <text x="118" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Format : JSON + JavaScript</text>

    <!-- GitHub reference -->
    <g transform="translate(16, 168)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <path d="M7,14 Q7,11 8,10 Q6,10 6,8 Q6,6 7,5 Q7,4 8,4 Q9,3 10,3 Q11,3 12,4 Q13,4 13,5 Q14,6 14,8 Q14,10 12,10 Q13,11 13,14" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="25" y="14" font-size="9" fill="#94a3b8">Pull Request sur GitHub</text>
    </g>

    <text x="118" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#a855f7">Effort : &#xc9;lev&#xe9; &#x2022; Impact : Tr&#xe8;s &#xe9;lev&#xe9;</text>
  </g>

  <!-- Card 3: R&#xe9;sultats de recherche (blue) -->
  <g transform="translate(536, 65)">
    <rect x="0" y="0" width="235" height="220" rx="12" fill="rgba(96,165,250,0.06)" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Chart/paper icon -->
    <g transform="translate(16, 14)">
      <rect x="0" y="0" width="18" height="24" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
      <line x1="4" y1="6" x2="14" y2="6" stroke="#60a5fa" stroke-width="0.8"/>
      <line x1="4" y1="10" x2="14" y2="10" stroke="#60a5fa" stroke-width="0.8"/>
      <polyline points="4,20 7,16 10,18 14,14" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
    </g>
    <text x="48" y="32" font-size="13" font-weight="700" fill="#60a5fa">R&#xe9;sultats de recherche</text>
    <line x1="12" y1="46" x2="223" y2="46" stroke="#334155" stroke-width="0.5"/>

    <text x="118" y="68" text-anchor="middle" font-size="10" fill="#e2e8f0">Partagez r&#xe9;sultats</text>
    <text x="118" y="82" text-anchor="middle" font-size="10" fill="#e2e8f0">et m&#xe9;thodologie</text>

    <rect x="16" y="96" width="203" height="24" rx="6" fill="rgba(96,165,250,0.08)"/>
    <text x="118" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Publiez dans GitHub Discussions</text>

    <rect x="16" y="128" width="203" height="24" rx="6" fill="rgba(96,165,250,0.08)"/>
    <text x="118" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Format : Rapport + donn&#xe9;es</text>

    <!-- GitHub reference -->
    <g transform="translate(16, 168)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <path d="M7,14 Q7,11 8,10 Q6,10 6,8 Q6,6 7,5 Q7,4 8,4 Q9,3 10,3 Q11,3 12,4 Q13,4 13,5 Q14,6 14,8 Q14,10 12,10 Q13,11 13,14" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="25" y="14" font-size="9" fill="#94a3b8">Publier dans Discussions</text>
    </g>

    <text x="118" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#60a5fa">Effort : Faible &#x2022; Impact : Communaut&#xe9;</text>
  </g>

  <!-- Bottom insight box -->
  <g transform="translate(40, 302)">
    <rect x="0" y="0" width="720" height="38" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="15" text-anchor="middle" font-size="10" fill="#e2e8f0">L'open source signifie que votre contribution aide chaque futur &#xe9;tudiant.</text>
    <text x="360" y="31" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">Une seule suite de benchmarks peut &#xea;tre utilis&#xe9;e par des milliers de personnes.</text>
  </g>
</svg>