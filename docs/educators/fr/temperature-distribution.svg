<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgT1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgT1)"/>

  <text x="400" y="35" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Comment la température transforme la distribution</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">Mêmes logits, températures différentes — la "confiance" du modèle change</text>

  <!-- ======== T=0.1 ======== -->
  <g transform="translate(30, 85)">
    <!-- Label column -->
    <text x="0" y="14" font-size="13" font-weight="700" fill="#4ade80">T = 0.1</text>
    <text x="0" y="30" font-size="11" fill="#94a3b8">Déterministe</text>
    <!-- Badge -->
    <rect x="0" y="42" width="55" height="22" rx="11" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="27" y="57" text-anchor="middle" font-size="9" font-weight="600" fill="#4ade80">Sûr</text>
  </g>
  <!-- Bars -->
  <g transform="translate(160, 80)">
    <rect x="0" y="0" width="28" height="80" rx="3" fill="#4ade80" opacity="0.85"/>
    <text x="14" y="92" text-anchor="middle" font-size="9" fill="#4ade80">92%</text>
    <rect x="45" y="67" width="28" height="13" rx="3" fill="#4ade80" opacity="0.4"/>
    <rect x="90" y="72" width="28" height="8" rx="3" fill="#4ade80" opacity="0.25"/>
    <rect x="135" y="73" width="28" height="7" rx="3" fill="#4ade80" opacity="0.15"/>
    <rect x="180" y="74" width="28" height="6" rx="3" fill="#4ade80" opacity="0.1"/>
    <rect x="225" y="75" width="28" height="5" rx="3" fill="#4ade80" opacity="0.08"/>
    <rect x="270" y="75" width="28" height="5" rx="3" fill="#4ade80" opacity="0.06"/>
    <rect x="315" y="76" width="28" height="4" rx="3" fill="#4ade80" opacity="0.05"/>
    <rect x="360" y="76" width="28" height="4" rx="3" fill="#4ade80" opacity="0.04"/>
    <rect x="405" y="77" width="28" height="3" rx="3" fill="#4ade80" opacity="0.04"/>
    <rect x="450" y="77" width="28" height="3" rx="3" fill="#4ade80" opacity="0.03"/>
    <rect x="495" y="77" width="28" height="3" rx="3" fill="#4ade80" opacity="0.03"/>
    <line x1="-5" y1="80" x2="525" y2="80" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- ======== T=0.7 ======== -->
  <g transform="translate(30, 215)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#a855f7">T = 0.7</text>
    <text x="0" y="30" font-size="11" fill="#94a3b8">Équilibré</text>
    <rect x="0" y="42" width="55" height="22" rx="11" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="27" y="57" text-anchor="middle" font-size="9" font-weight="600" fill="#a855f7">Créatif</text>
  </g>
  <g transform="translate(160, 210)">
    <rect x="0" y="0" width="28" height="55" rx="3" fill="#a855f7" opacity="0.85"/>
    <text x="14" y="67" text-anchor="middle" font-size="9" fill="#a855f7">38%</text>
    <rect x="45" y="20" width="28" height="35" rx="3" fill="#a855f7" opacity="0.7"/>
    <text x="59" y="67" text-anchor="middle" font-size="9" fill="#a855f7">22%</text>
    <rect x="90" y="32" width="28" height="23" rx="3" fill="#a855f7" opacity="0.55"/>
    <rect x="135" y="38" width="28" height="17" rx="3" fill="#a855f7" opacity="0.4"/>
    <rect x="180" y="42" width="28" height="13" rx="3" fill="#a855f7" opacity="0.3"/>
    <rect x="225" y="45" width="28" height="10" rx="3" fill="#a855f7" opacity="0.25"/>
    <rect x="270" y="47" width="28" height="8" rx="3" fill="#a855f7" opacity="0.2"/>
    <rect x="315" y="48" width="28" height="7" rx="3" fill="#a855f7" opacity="0.15"/>
    <rect x="360" y="49" width="28" height="6" rx="3" fill="#a855f7" opacity="0.12"/>
    <rect x="405" y="50" width="28" height="5" rx="3" fill="#a855f7" opacity="0.1"/>
    <rect x="450" y="50" width="28" height="5" rx="3" fill="#a855f7" opacity="0.08"/>
    <rect x="495" y="51" width="28" height="4" rx="3" fill="#a855f7" opacity="0.06"/>
    <line x1="-5" y1="55" x2="525" y2="55" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- ======== T=2.0 ======== -->
  <g transform="translate(30, 335)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#ef4444">T = 2.0</text>
    <text x="0" y="30" font-size="11" fill="#94a3b8">Chaotique</text>
    <rect x="0" y="42" width="65" height="22" rx="11" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="32" y="57" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">Aléatoire</text>
  </g>
  <g transform="translate(160, 335)">
    <rect x="0" y="0" width="28" height="22" rx="3" fill="#ef4444" opacity="0.7"/>
    <text x="14" y="32" text-anchor="middle" font-size="9" fill="#ef4444">12%</text>
    <rect x="45" y="2" width="28" height="20" rx="3" fill="#ef4444" opacity="0.65"/>
    <text x="59" y="32" text-anchor="middle" font-size="9" fill="#ef4444">11%</text>
    <rect x="90" y="4" width="28" height="18" rx="3" fill="#ef4444" opacity="0.6"/>
    <rect x="135" y="5" width="28" height="17" rx="3" fill="#ef4444" opacity="0.55"/>
    <rect x="180" y="6" width="28" height="16" rx="3" fill="#ef4444" opacity="0.5"/>
    <rect x="225" y="7" width="28" height="15" rx="3" fill="#ef4444" opacity="0.45"/>
    <rect x="270" y="8" width="28" height="14" rx="3" fill="#ef4444" opacity="0.4"/>
    <rect x="315" y="9" width="28" height="13" rx="3" fill="#ef4444" opacity="0.38"/>
    <rect x="360" y="10" width="28" height="12" rx="3" fill="#ef4444" opacity="0.35"/>
    <rect x="405" y="11" width="28" height="11" rx="3" fill="#ef4444" opacity="0.32"/>
    <rect x="450" y="12" width="28" height="10" rx="3" fill="#ef4444" opacity="0.3"/>
    <rect x="495" y="12" width="28" height="10" rx="3" fill="#ef4444" opacity="0.28"/>
    <line x1="-5" y1="22" x2="525" y2="22" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- Token labels along bottom -->
  <g transform="translate(160, 420)">
    <text x="14" y="0" text-anchor="middle" font-size="10" fill="#64748b">the</text>
    <text x="59" y="0" text-anchor="middle" font-size="10" fill="#64748b">a</text>
    <text x="104" y="0" text-anchor="middle" font-size="10" fill="#64748b">is</text>
    <text x="149" y="0" text-anchor="middle" font-size="10" fill="#64748b">an</text>
    <text x="194" y="0" text-anchor="middle" font-size="10" fill="#64748b">was</text>
    <text x="239" y="0" text-anchor="middle" font-size="10" fill="#64748b">it</text>
    <text x="284" y="0" text-anchor="middle" font-size="10" fill="#64748b">has</text>
    <text x="329" y="0" text-anchor="middle" font-size="10" fill="#64748b">can</text>
    <text x="374" y="0" text-anchor="middle" font-size="10" fill="#64748b">my</text>
    <text x="419" y="0" text-anchor="middle" font-size="10" fill="#64748b">we</text>
    <text x="464" y="0" text-anchor="middle" font-size="10" fill="#64748b">not</text>
    <text x="509" y="0" text-anchor="middle" font-size="10" fill="#64748b">oh</text>
  </g>

  <!-- Formula -->
  <text x="400" y="458" text-anchor="middle" font-size="12" fill="#94a3b8">P(token) = exp(logit / T) / sum( exp(logits / T) )</text>
  <text x="400" y="478" text-anchor="middle" font-size="11" fill="#64748b">T bas accentue le pic | T élevé aplatit vers l'uniforme</text>
</svg>
