<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="16" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Pourquoi les LLMs ne peuvent pas compter les lettres dans "Strawberry"</text>

  <!-- The word as humans see it -->
  <text x="130" y="80" font-size="12" font-weight="600" fill="#4ade80">Ce que les humains voient :</text>

  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="14" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">s</text>
    <rect x="32" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="46" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">t</text>
    <rect x="64" y="0" width="28" height="36" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="78" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#ef4444" font-family="'Courier New',monospace">r</text>
    <rect x="96" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="110" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">a</text>
    <rect x="128" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="142" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">w</text>
    <rect x="160" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="174" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">b</text>
    <rect x="192" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="206" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">e</text>
    <rect x="224" y="0" width="28" height="36" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="238" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#ef4444" font-family="'Courier New',monospace">r</text>
    <rect x="256" y="0" width="28" height="36" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="270" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#ef4444" font-family="'Courier New',monospace">r</text>
    <rect x="288" y="0" width="28" height="36" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="302" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0" font-family="'Courier New',monospace">y</text>
  </g>
  <text x="395" y="114" font-size="12" fill="#ef4444" font-weight="600">← 3 r visibles</text>

  <!-- Divider -->
  <line x1="50" y1="145" x2="750" y2="145" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <text x="400" y="142" text-anchor="middle" font-size="10" fill="#64748b" style="background: #0f0a2e">vs</text>

  <!-- The word as the model sees it -->
  <text x="130" y="175" font-size="12" font-weight="600" fill="#a855f7">Ce que le modèle voit :</text>

  <g transform="translate(50, 185)">
    <!-- Token 1: "st" -->
    <rect x="0" y="0" width="75" height="44" rx="6" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="2"/>
    <text x="37" y="20" text-anchor="middle" font-size="9" fill="#c084fc">Token 1</text>
    <text x="37" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" font-family="'Courier New',monospace">str</text>

    <!-- Token 2: "aw" -->
    <rect x="90" y="0" width="75" height="44" rx="6" fill="rgba(96,165,250,0.2)" stroke="#60a5fa" stroke-width="2"/>
    <text x="127" y="20" text-anchor="middle" font-size="9" fill="#93c5fd">Token 2</text>
    <text x="127" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" font-family="'Courier New',monospace">aw</text>

    <!-- Token 3: "berry" -->
    <rect x="180" y="0" width="100" height="44" rx="6" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="2"/>
    <text x="230" y="20" text-anchor="middle" font-size="9" fill="#fcd34d">Token 3</text>
    <text x="230" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" font-family="'Courier New',monospace">berry</text>
  </g>

  <!-- Explanation box -->
  <g transform="translate(400, 180)">
    <rect x="0" y="0" width="350" height="70" rx="10" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1"/>
    <text x="175" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f87171">Le modèle ne peut pas voir les lettres individuelles</text>
    <text x="175" y="42" text-anchor="middle" font-size="11" fill="#e2e8f0">"r" appears once in "str", once in "berry"</text>
    <text x="175" y="58" text-anchor="middle" font-size="11" fill="#94a3b8">The middle "r" in "aw" + "berry" boundary is invisible</text>
  </g>
</svg>