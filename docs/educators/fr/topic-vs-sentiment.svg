<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgTopicFr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgTopicFr)"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Th&#xe8;me vs Sentiment dans l'espace vectoriel</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">Les embeddings capturent ce dont vous parlez, pas ce que vous en pensez</text>

  <!-- Conceptual 2D space -->
  <g transform="translate(60, 75)">
    <!-- Faint axes -->
    <line x1="0" y1="260" x2="680" y2="260" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#334155" stroke-width="0.5" opacity="0.4"/>

    <!-- Movie cluster (top-left) -->
    <!-- Dotted circle around cluster -->
    <ellipse cx="185" cy="90" rx="155" ry="80" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <text x="185" y="18" text-anchor="middle" font-size="10" fill="#94a3b8" opacity="0.6">M&#xea;me th&#xe8;me (cin&#xe9;ma)</text>

    <!-- Green dot: J'adore ce film -->
    <circle cx="140" cy="80" r="8" fill="#4ade80" opacity="0.85"/>
    <text x="140" y="110" text-anchor="middle" font-size="10" fill="#4ade80">&#xAB; J'adore ce film &#xBB;</text>

    <!-- Red dot: Je d&#xe9;teste ce film -->
    <circle cx="230" cy="85" r="8" fill="#ef4444" opacity="0.85"/>
    <text x="230" y="115" text-anchor="middle" font-size="10" fill="#ef4444">&#xAB; Je d&#xe9;teste ce film &#xBB;</text>

    <!-- Similarity line between movie dots -->
    <line x1="148" y1="80" x2="222" y2="85" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2"/>
    <rect x="150" y="56" width="90" height="18" rx="4" fill="rgba(251,191,36,0.12)"/>
    <text x="195" y="68" text-anchor="middle" font-size="9" font-weight="600" fill="#fbbf24">Similarit&#xe9; : 0.92</text>

    <!-- Weather cluster (bottom-right) -->
    <ellipse cx="520" cy="195" rx="155" ry="65" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <text x="520" y="145" text-anchor="middle" font-size="10" fill="#94a3b8" opacity="0.6">M&#xea;me th&#xe8;me (m&#xe9;t&#xe9;o)</text>

    <!-- Blue dot: weather is nice -->
    <circle cx="475" cy="190" r="8" fill="#60a5fa" opacity="0.85"/>
    <text x="475" y="220" text-anchor="middle" font-size="10" fill="#60a5fa">&#xAB; Il fait beau aujourd'hui &#xBB;</text>

    <!-- Blue dot: raining -->
    <circle cx="570" cy="195" r="8" fill="#60a5fa" opacity="0.85"/>
    <text x="570" y="225" text-anchor="middle" font-size="10" fill="#60a5fa">&#xAB; Il pleut dehors &#xBB;</text>

    <!-- Dashed line between clusters showing low similarity -->
    <line x1="250" y1="100" x2="460" y2="185" stroke="#ef4444" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
    <!-- Similarity label on the cross-cluster line -->
    <g transform="translate(340, 130)">
      <rect x="-48" y="-10" width="96" height="20" rx="4" fill="rgba(239,68,68,0.12)"/>
      <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">Similarit&#xe9; : 0.31</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 358)">
    <circle cx="0" cy="0" r="5" fill="#4ade80" opacity="0.85"/>
    <text x="12" y="4" font-size="10" fill="#e2e8f0">Sentiment positif</text>

    <circle cx="160" cy="0" r="5" fill="#ef4444" opacity="0.85"/>
    <text x="172" y="4" font-size="10" fill="#e2e8f0">Sentiment n&#xe9;gatif</text>

    <circle cx="320" cy="0" r="5" fill="#60a5fa" opacity="0.85"/>
    <text x="332" y="4" font-size="10" fill="#e2e8f0">Neutre / vari&#xe9;</text>
  </g>

  <!-- Bottom insight -->
  <text x="400" y="386" text-anchor="middle" font-size="11" fill="#fbbf24">Des sentiments oppos&#xe9;s sur le m&#xea;me th&#xe8;me sont plus proches que des sentiments identiques sur des th&#xe8;mes diff&#xe9;rents</text>
</svg>