<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgSamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" rx="16" fill="url(#bgSamp)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Méthodes d'échantillonnage comparées</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">Différentes stratégies pour choisir le prochain token dans la distribution</text>

  <!-- Greedy -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="170" height="240" rx="12" fill="rgba(74,222,128,0.06)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#4ade80">Greedy</text>
    <text x="85" y="46" text-anchor="middle" font-size="10" fill="#94a3b8">T = 0</text>

    <!-- Bar chart showing one bar selected -->
    <rect x="20" y="65" width="24" height="100" rx="3" fill="#4ade80" opacity="0.9"/>
    <rect x="50" y="125" width="24" height="40" rx="3" fill="#4ade80" opacity="0.15"/>
    <rect x="80" y="135" width="24" height="30" rx="3" fill="#4ade80" opacity="0.1"/>
    <rect x="110" y="140" width="24" height="25" rx="3" fill="#4ade80" opacity="0.07"/>
    <!-- Selection arrow -->
    <text x="32" y="58" text-anchor="middle" font-size="14" fill="#4ade80">&#x2193;</text>

    <text x="85" y="190" text-anchor="middle" font-size="11" fill="#e2e8f0">Choisit toujours</text>
    <text x="85" y="205" text-anchor="middle" font-size="11" fill="#e2e8f0">le plus élevé</text>
    <text x="85" y="225" text-anchor="middle" font-size="10" fill="#64748b">Déterministe</text>
    <text x="85" y="238" text-anchor="middle" font-size="10" fill="#64748b">Même sortie à chaque fois</text>
  </g>

  <!-- Top-k -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="170" height="240" rx="12" fill="rgba(96,165,250,0.06)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#60a5fa">Top-k</text>
    <text x="85" y="46" text-anchor="middle" font-size="10" fill="#94a3b8">k = 3</text>

    <!-- Bar chart showing top 3 selected -->
    <rect x="20" y="65" width="24" height="100" rx="3" fill="#60a5fa" opacity="0.8"/>
    <rect x="50" y="105" width="24" height="60" rx="3" fill="#60a5fa" opacity="0.6"/>
    <rect x="80" y="125" width="24" height="40" rx="3" fill="#60a5fa" opacity="0.4"/>
    <rect x="110" y="140" width="24" height="25" rx="3" fill="#60a5fa" opacity="0.08"/>
    <!-- Selection bracket -->
    <line x1="18" y1="60" x2="106" y2="60" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="62" y="54" text-anchor="middle" font-size="10" fill="#60a5fa">échantillonner parmi les 3 premiers</text>

    <text x="85" y="190" text-anchor="middle" font-size="11" fill="#e2e8f0">Choisit parmi les</text>
    <text x="85" y="205" text-anchor="middle" font-size="11" fill="#e2e8f0">k meilleurs candidats</text>
    <text x="85" y="225" text-anchor="middle" font-size="10" fill="#64748b">Nombre fixe</text>
    <text x="85" y="238" text-anchor="middle" font-size="10" fill="#64748b">d'options</text>
  </g>

  <!-- Top-p (nucleus) -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="170" height="240" rx="12" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#a855f7">Top-p (Nucleus)</text>
    <text x="85" y="46" text-anchor="middle" font-size="10" fill="#94a3b8">p = 0.9</text>

    <!-- Bar chart showing cumulative selection -->
    <rect x="20" y="65" width="24" height="100" rx="3" fill="#a855f7" opacity="0.8"/>
    <rect x="50" y="105" width="24" height="60" rx="3" fill="#a855f7" opacity="0.6"/>
    <rect x="80" y="125" width="24" height="40" rx="3" fill="#a855f7" opacity="0.4"/>
    <rect x="110" y="135" width="24" height="30" rx="3" fill="#a855f7" opacity="0.3"/>
    <!-- Cumulative bracket -->
    <line x1="18" y1="60" x2="136" y2="60" stroke="#a855f7" stroke-width="1.5"/>
    <text x="77" y="54" text-anchor="middle" font-size="10" fill="#a855f7">jusqu'à 90% cumulé</text>

    <text x="85" y="190" text-anchor="middle" font-size="11" fill="#e2e8f0">Choisit dans le plus petit</text>
    <text x="85" y="205" text-anchor="middle" font-size="11" fill="#e2e8f0">ensemble totalisant p</text>
    <text x="85" y="225" text-anchor="middle" font-size="10" fill="#64748b">Nombre adaptatif</text>
    <text x="85" y="238" text-anchor="middle" font-size="10" fill="#64748b">d'options</text>
  </g>

  <!-- Temperature -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="170" height="240" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">Temperature</text>
    <text x="85" y="46" text-anchor="middle" font-size="10" fill="#94a3b8">appliquée avant l'échantillonnage</text>

    <!-- Two small distributions -->
    <text x="42" y="70" text-anchor="middle" font-size="9" fill="#4ade80">T=0.2</text>
    <rect x="20" y="75" width="14" height="70" rx="2" fill="#4ade80" opacity="0.7"/>
    <rect x="36" y="120" width="14" height="25" rx="2" fill="#4ade80" opacity="0.2"/>

    <text x="120" y="70" text-anchor="middle" font-size="9" fill="#ef4444">T=1.5</text>
    <rect x="98" y="95" width="14" height="50" rx="2" fill="#ef4444" opacity="0.5"/>
    <rect x="114" y="105" width="14" height="40" rx="2" fill="#ef4444" opacity="0.4"/>
    <rect x="130" y="110" width="14" height="35" rx="2" fill="#ef4444" opacity="0.3"/>

    <text x="85" y="175" text-anchor="middle" font-size="11" fill="#e2e8f0">Transforme la</text>
    <text x="85" y="190" text-anchor="middle" font-size="11" fill="#e2e8f0">distribution d'abord,</text>
    <text x="85" y="205" text-anchor="middle" font-size="11" fill="#e2e8f0">puis échantillonne</text>
    <text x="85" y="225" text-anchor="middle" font-size="10" fill="#64748b">Contrôle la netteté</text>
    <text x="85" y="238" text-anchor="middle" font-size="10" fill="#64748b">des probabilités</text>
  </g>
</svg>