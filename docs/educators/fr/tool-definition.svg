<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgDefFr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" rx="16" fill="url(#bgDefFr)"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Anatomie d&#x2019;une d&#xe9;finition d&#x2019;outil</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#94a3b8">Le sch&#xe9;ma JSON qui indique au mod&#xe8;le quels outils existent</text>

  <!-- JSON code block background -->
  <rect x="30" y="68" width="370" height="256" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(148,163,184,0.2)" stroke-width="1"/>

  <!-- JSON code (monospace, syntax colored) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="10">
    <text x="44" y="90" fill="#94a3b8">{</text>
    <text x="56" y="106" fill="#60a5fa">"type"</text><text x="96" y="106" fill="#94a3b8">:</text><text x="104" y="106" fill="#4ade80">"function"</text><text x="172" y="106" fill="#94a3b8">,</text>
    <text x="56" y="122" fill="#60a5fa">"function"</text><text x="120" y="122" fill="#94a3b8">: {</text>

    <!-- name line (y=138) -->
    <text x="72" y="142" fill="#60a5fa">"name"</text><text x="112" y="142" fill="#94a3b8">:</text><text x="120" y="142" fill="#4ade80">"weather_check"</text><text x="228" y="142" fill="#94a3b8">,</text>

    <!-- description line (y=158) -->
    <text x="72" y="162" fill="#60a5fa">"description"</text><text x="160" y="162" fill="#94a3b8">:</text>
    <text x="84" y="178" fill="#4ade80">"Get current weather..."</text><text x="256" y="178" fill="#94a3b8">,</text>

    <!-- parameters block -->
    <text x="72" y="198" fill="#60a5fa">"parameters"</text><text x="152" y="198" fill="#94a3b8">: {</text>
    <text x="88" y="214" fill="#60a5fa">"type"</text><text x="128" y="214" fill="#94a3b8">:</text><text x="136" y="214" fill="#4ade80">"object"</text><text x="192" y="214" fill="#94a3b8">,</text>
    <text x="88" y="230" fill="#60a5fa">"properties"</text><text x="168" y="230" fill="#94a3b8">: {</text>
    <text x="104" y="246" fill="#60a5fa">"city"</text><text x="140" y="246" fill="#94a3b8">: {</text>
    <text x="120" y="262" fill="#60a5fa">"type"</text><text x="160" y="262" fill="#94a3b8">:</text><text x="168" y="262" fill="#4ade80">"string"</text><text x="224" y="262" fill="#94a3b8">,</text>
    <text x="120" y="278" fill="#60a5fa">"description"</text><text x="208" y="278" fill="#94a3b8">:</text><text x="216" y="278" fill="#4ade80">"City name"</text>
    <text x="104" y="294" fill="#94a3b8">} },</text>

    <!-- required line (y=310) -->
    <text x="88" y="310" fill="#60a5fa">"required"</text><text x="156" y="310" fill="#94a3b8">: [</text><text x="168" y="310" fill="#4ade80">"city"</text><text x="204" y="310" fill="#94a3b8">]</text>

    <text x="72" y="322" fill="#94a3b8">} } }</text>
  </g>

  <!-- Annotation lines and labels (right side) -->

  <!-- name annotation (blue) -->
  <line x1="400" y1="140" x2="440" y2="140" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="400" cy="140" r="3" fill="#60a5fa"/>
  <rect x="448" y="128" width="320" height="26" rx="6" fill="rgba(96,165,250,0.08)" stroke="#60a5fa" stroke-width="1"/>
  <text x="460" y="140" font-size="9" font-weight="700" fill="#60a5fa">name</text>
  <text x="500" y="140" font-size="9" fill="#e2e8f0">Comment le mod&#xe8;le d&#xe9;signe cet outil</text>
  <text x="460" y="150" font-size="8" fill="#94a3b8">Doit &#xea;tre unique parmi tous les outils</text>

  <!-- description annotation (red, emphasized) -->
  <line x1="400" y1="170" x2="440" y2="170" stroke="#ef4444" stroke-width="2"/>
  <circle cx="400" cy="170" r="3" fill="#ef4444"/>
  <rect x="448" y="156" width="320" height="32" rx="6" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="460" y="169" font-size="9" font-weight="700" fill="#ef4444">description  CRITIQUE</text>
  <text x="460" y="181" font-size="9" fill="#e2e8f0">Le seul guide du mod&#xe8;le pour savoir quand l&#x2019;utiliser</text>

  <!-- parameters annotation (purple) -->
  <line x1="400" y1="246" x2="440" y2="246" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="400" cy="246" r="3" fill="#a855f7"/>
  <rect x="448" y="234" width="320" height="26" rx="6" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="1"/>
  <text x="460" y="246" font-size="9" font-weight="700" fill="#a855f7">parameters</text>
  <text x="520" y="246" font-size="9" fill="#e2e8f0">Arguments que le mod&#xe8;le doit g&#xe9;n&#xe9;rer</text>
  <text x="460" y="256" font-size="8" fill="#94a3b8">Suit le format JSON Schema</text>

  <!-- required annotation (green) -->
  <line x1="400" y1="308" x2="440" y2="308" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="400" cy="308" r="3" fill="#4ade80"/>
  <rect x="448" y="296" width="320" height="26" rx="6" fill="rgba(74,222,128,0.08)" stroke="#4ade80" stroke-width="1"/>
  <text x="460" y="308" font-size="9" font-weight="700" fill="#4ade80">required</text>
  <text x="508" y="308" font-size="9" fill="#e2e8f0">Le mod&#xe8;le doit fournir ceux-ci</text>
  <text x="460" y="318" font-size="8" fill="#94a3b8">Les champs omis sont optionnels par d&#xe9;faut</text>

  <!-- Bottom insight -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="720" height="28" rx="8" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="18" text-anchor="middle" font-size="10" fill="#ef4444">Une mauvaise description = mauvais choix d&#x2019;outil. Le mod&#xe8;le lit ce texte pour d&#xe9;cider si votre outil correspond &#xe0; la requ&#xea;te.</text>
  </g>
</svg>