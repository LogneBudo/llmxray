<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgContrib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="350" rx="16" fill="url(#bgContrib)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Three Paths to Contribution</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">Every student can give back to the community</text>

  <!-- Card 1: Custom Benchmarks (green) — x: 30, width: 235 -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="235" height="220" rx="12" fill="rgba(74,222,128,0.06)" stroke="#4ade80" stroke-width="1.5"/>
    <!-- Clipboard icon -->
    <g transform="translate(16, 16)">
      <rect x="3" y="0" width="16" height="4" rx="2" fill="none" stroke="#4ade80" stroke-width="1.2"/>
      <rect x="0" y="3" width="22" height="22" rx="3" fill="none" stroke="#4ade80" stroke-width="1.2"/>
      <line x1="5" y1="11" x2="17" y2="11" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="16" x2="17" y2="16" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="21" x2="12" y2="21" stroke="#4ade80" stroke-width="1" stroke-linecap="round"/>
    </g>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#4ade80">Custom Benchmarks</text>
    <line x1="12" y1="46" x2="223" y2="46" stroke="#334155" stroke-width="0.5"/>

    <text x="118" y="68" text-anchor="middle" font-size="10" fill="#e2e8f0">Design 20+ questions</text>
    <text x="118" y="82" text-anchor="middle" font-size="10" fill="#e2e8f0">for your domain</text>

    <rect x="16" y="96" width="203" height="24" rx="6" fill="rgba(74,222,128,0.08)"/>
    <text x="118" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Submit to community-benchmarks/</text>

    <rect x="16" y="128" width="203" height="24" rx="6" fill="rgba(74,222,128,0.08)"/>
    <text x="118" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Format: JSON with schema validation</text>

    <!-- GitHub reference -->
    <g transform="translate(16, 168)">
      <!-- GitHub icon simplified -->
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <path d="M7,14 Q7,11 8,10 Q6,10 6,8 Q6,6 7,5 Q7,4 8,4 Q9,3 10,3 Q11,3 12,4 Q13,4 13,5 Q14,6 14,8 Q14,10 12,10 Q13,11 13,14" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="25" y="14" font-size="9" fill="#94a3b8">Pull Request on GitHub</text>
    </g>

    <!-- Effort indicator -->
    <text x="118" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#4ade80">Effort: Medium &#x2022; Impact: High</text>
  </g>

  <!-- Card 2: Custom Tools (purple) — x: 283, width: 235 -->
  <g transform="translate(283, 65)">
    <rect x="0" y="0" width="235" height="220" rx="12" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Wrench/gear icon -->
    <g transform="translate(16, 16)">
      <circle cx="11" cy="11" r="7" fill="none" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="11" cy="11" r="3" fill="none" stroke="#a855f7" stroke-width="1.2"/>
      <line x1="11" y1="0" x2="11" y2="4" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
      <line x1="11" y1="18" x2="11" y2="22" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="11" x2="4" y2="11" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
      <line x1="18" y1="11" x2="22" y2="11" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#a855f7">Custom Tools</text>
    <line x1="12" y1="46" x2="223" y2="46" stroke="#334155" stroke-width="0.5"/>

    <text x="118" y="68" text-anchor="middle" font-size="10" fill="#e2e8f0">Build a tool that solves</text>
    <text x="118" y="82" text-anchor="middle" font-size="10" fill="#e2e8f0">a real problem</text>

    <rect x="16" y="96" width="203" height="24" rx="6" fill="rgba(168,85,247,0.08)"/>
    <text x="118" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Submit to community-tools/</text>

    <rect x="16" y="128" width="203" height="24" rx="6" fill="rgba(168,85,247,0.08)"/>
    <text x="118" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Format: JSON + JavaScript</text>

    <!-- GitHub reference -->
    <g transform="translate(16, 168)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <path d="M7,14 Q7,11 8,10 Q6,10 6,8 Q6,6 7,5 Q7,4 8,4 Q9,3 10,3 Q11,3 12,4 Q13,4 13,5 Q14,6 14,8 Q14,10 12,10 Q13,11 13,14" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="25" y="14" font-size="9" fill="#94a3b8">Pull Request on GitHub</text>
    </g>

    <text x="118" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#a855f7">Effort: High &#x2022; Impact: Very High</text>
  </g>

  <!-- Card 3: Research Findings (blue) — x: 536, width: 235 -->
  <g transform="translate(536, 65)">
    <rect x="0" y="0" width="235" height="220" rx="12" fill="rgba(96,165,250,0.06)" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Chart/paper icon -->
    <g transform="translate(16, 14)">
      <rect x="0" y="0" width="18" height="24" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
      <line x1="4" y1="6" x2="14" y2="6" stroke="#60a5fa" stroke-width="0.8"/>
      <line x1="4" y1="10" x2="14" y2="10" stroke="#60a5fa" stroke-width="0.8"/>
      <polyline points="4,20 7,16 10,18 14,14" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
    </g>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#60a5fa">Research Findings</text>
    <line x1="12" y1="46" x2="223" y2="46" stroke="#334155" stroke-width="0.5"/>

    <text x="118" y="68" text-anchor="middle" font-size="10" fill="#e2e8f0">Share results and</text>
    <text x="118" y="82" text-anchor="middle" font-size="10" fill="#e2e8f0">methodology</text>

    <rect x="16" y="96" width="203" height="24" rx="6" fill="rgba(96,165,250,0.08)"/>
    <text x="118" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Post in GitHub Discussions</text>

    <rect x="16" y="128" width="203" height="24" rx="6" fill="rgba(96,165,250,0.08)"/>
    <text x="118" y="144" text-anchor="middle" font-size="9" fill="#94a3b8">Format: Report + data</text>

    <!-- GitHub reference -->
    <g transform="translate(16, 168)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1"/>
      <path d="M7,14 Q7,11 8,10 Q6,10 6,8 Q6,6 7,5 Q7,4 8,4 Q9,3 10,3 Q11,3 12,4 Q13,4 13,5 Q14,6 14,8 Q14,10 12,10 Q13,11 13,14" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="25" y="14" font-size="9" fill="#94a3b8">Post in Discussions</text>
    </g>

    <text x="118" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#60a5fa">Effort: Low &#x2022; Impact: Community</text>
  </g>

  <!-- Bottom insight box -->
  <g transform="translate(40, 302)">
    <rect x="0" y="0" width="720" height="38" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="15" text-anchor="middle" font-size="10" fill="#e2e8f0">Open source means your contribution helps every future student.</text>
    <text x="360" y="31" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">One benchmark suite can be used by thousands.</text>
  </g>
</svg>