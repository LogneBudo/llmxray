<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgCtx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="340" rx="16" fill="url(#bgCtx)"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">The Context Window</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">A fixed-size buffer — not memory</text>

  <!-- Message strip: 9 blocks across the full width -->
  <!-- Faded messages (outside window) — Sys prompt, User 1, AI 1, User 2, AI 2 -->
  <g opacity="0.3">
    <rect x="30" y="90" width="72" height="44" rx="6" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="66" y="116" text-anchor="middle" font-size="9" fill="#94a3b8">Sys prompt</text>

    <rect x="108" y="90" width="72" height="44" rx="6" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1"/>
    <text x="144" y="116" text-anchor="middle" font-size="9" fill="#94a3b8">User 1</text>

    <rect x="186" y="90" width="72" height="44" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="222" y="116" text-anchor="middle" font-size="9" fill="#94a3b8">AI 1</text>

    <rect x="264" y="90" width="72" height="44" rx="6" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1"/>
    <text x="300" y="116" text-anchor="middle" font-size="9" fill="#94a3b8">User 2</text>

    <rect x="342" y="90" width="72" height="44" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="378" y="116" text-anchor="middle" font-size="9" fill="#94a3b8">AI 2</text>

    <!-- X marks on faded messages -->
    <line x1="40" y1="95" x2="92" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="92" y1="95" x2="40" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

    <line x1="118" y1="95" x2="170" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="170" y1="95" x2="118" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

    <line x1="196" y1="95" x2="248" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="248" y1="95" x2="196" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

    <line x1="274" y1="95" x2="326" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="326" y1="95" x2="274" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

    <line x1="352" y1="95" x2="404" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="404" y1="95" x2="352" y2="129" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Active messages (inside window) — User 3, AI 3, User 4, AI 4 -->
  <rect x="420" y="90" width="82" height="44" rx="6" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="461" y="116" text-anchor="middle" font-size="9.5" font-weight="600" fill="#60a5fa">User 3</text>

  <rect x="508" y="90" width="82" height="44" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="549" y="116" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4ade80">AI 3</text>

  <rect x="596" y="90" width="82" height="44" rx="6" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="637" y="116" text-anchor="middle" font-size="9.5" font-weight="600" fill="#60a5fa">User 4</text>

  <rect x="684" y="90" width="82" height="44" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="725" y="116" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4ade80">AI 4</text>

  <!-- Context window bracket -->
  <rect x="414" y="80" width="358" height="64" rx="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="593" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">4,096 tokens</text>

  <!-- Arrow to faded messages -->
  <line x1="220" y1="150" x2="220" y2="172" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="216,172 220,180 224,172" fill="#ef4444"/>
  <text x="220" y="196" text-anchor="middle" font-size="10" fill="#ef4444">Forgotten</text>
  <text x="220" y="210" text-anchor="middle" font-size="9" fill="#94a3b8">Model cannot see these</text>

  <!-- Arrow to active messages -->
  <line x1="593" y1="150" x2="593" y2="172" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="589,172 593,180 597,172" fill="#4ade80"/>
  <text x="593" y="196" text-anchor="middle" font-size="10" fill="#4ade80">Active context</text>
  <text x="593" y="210" text-anchor="middle" font-size="9" fill="#94a3b8">Model reads these every call</text>

  <!-- Divider line between zones -->
  <line x1="414" y1="82" x2="414" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Insight box -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="720" height="60" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="24" text-anchor="middle" font-size="11" fill="#e2e8f0">The model re-reads the entire visible context for every response.</text>
    <text x="360" y="42" text-anchor="middle" font-size="11" fill="#e2e8f0">There is no persistent memory.</text>
  </g>
</svg>