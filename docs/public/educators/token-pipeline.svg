<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="16" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">From Text to Token to Prediction</text>

  <!-- Step 1: Text -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#4ade80">INPUT</text>
    <text x="60" y="48" text-anchor="middle" font-size="13" fill="#e2e8f0">"What is</text>
    <text x="60" y="66" text-anchor="middle" font-size="13" fill="#e2e8f0">gravity?"</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(155, 95)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#a855f7" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#a855f7"/>
  </g>

  <!-- Step 2: Tokenizer -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#a855f7">TOKENIZER</text>
    <text x="60" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">BPE splits into</text>
    <text x="60" y="66" text-anchor="middle" font-size="12" fill="#e2e8f0" font-family="'Courier New',monospace">[What, is, grav, ity, ?]</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(325, 95)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#a855f7" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#a855f7"/>
  </g>

  <!-- Step 3: Token IDs -->
  <g transform="translate(370, 60)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">TOKEN IDs</text>
    <text x="60" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">Numbers the</text>
    <text x="60" y="66" text-anchor="middle" font-size="12" fill="#e2e8f0" font-family="'Courier New',monospace">[3923, 374, 82, 488, 30]</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(495, 95)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#a855f7" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#a855f7"/>
  </g>

  <!-- Step 4: Model -->
  <g transform="translate(535, 55)">
    <rect x="0" y="0" width="100" height="90" rx="10" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="50" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">MODEL</text>
    <text x="50" y="46" text-anchor="middle" font-size="28" fill="#fbbf24">🧠</text>
    <text x="50" y="76" text-anchor="middle" font-size="9" fill="#94a3b8">Transformer</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(640, 95)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#a855f7" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#a855f7"/>
  </g>

  <!-- Step 5: Prediction -->
  <g transform="translate(680, 55)">
    <rect x="0" y="0" width="100" height="90" rx="10" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="50" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#4ade80">OUTPUT</text>
    <text x="50" y="48" text-anchor="middle" font-size="9" fill="#94a3b8">Next token</text>
    <text x="50" y="48" text-anchor="middle" font-size="9" fill="#94a3b8">probabilities</text>
    <text x="50" y="66" text-anchor="middle" font-size="11" fill="#e2e8f0">"Gravity" → 0.72</text>
    <text x="50" y="80" text-anchor="middle" font-size="11" fill="#94a3b8">"It" → 0.15</text>
  </g>

  <!-- Bottom: the loop -->
  <path d="M 730,155 L 730,185 L 400,185 L 400,175" stroke="#c084fc" stroke-width="1.5" fill="none" stroke-dasharray="6 3" opacity="0.5"/>
  <polygon points="396,175 400,167 404,175" fill="#c084fc" opacity="0.5"/>
  <text x="565" y="198" text-anchor="middle" font-size="10" fill="#c084fc" opacity="0.7">Output token becomes input → repeat until done</text>
</svg>
