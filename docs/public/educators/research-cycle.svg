<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgCycle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4ade80"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="800" height="380" rx="16" fill="url(#bgCycle)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">The Research Cycle</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">Good research is systematic, reproducible, and honest</text>

  <!-- Cycle center at 400, 195. Radius ~120 for node placement -->
  <!-- 5 nodes at 72° intervals, starting from top (270°) going clockwise -->
  <!-- Step 1 (top):        400 + 120*cos(270°), 195 + 120*sin(270°) = 400, 75 -->
  <!-- Step 2 (top-right):  400 + 120*cos(342°), 195 + 120*sin(342°) = 514.2, 157.9 -->
  <!-- Step 3 (bottom-right):400 + 120*cos(54°), 195 + 120*sin(54°) = 470.5, 292.1 -->
  <!-- Step 4 (bottom-left): 400 + 120*cos(126°),195 + 120*sin(126°)= 329.5, 292.1 -->
  <!-- Step 5 (top-left):   400 + 120*cos(198°), 195 + 120*sin(198°)= 285.8, 157.9 -->

  <!-- Connecting arrows (curved paths between nodes) -->
  <!-- 1 → 2: Question to Hypothesis -->
  <path d="M 430,80 Q 490,90 500,145" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <!-- 2 → 3: Hypothesis to Experiment -->
  <path d="M 525,175 Q 540,240 485,280" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <!-- 3 → 4: Experiment to Analysis -->
  <path d="M 448,300 Q 400,320 355,300" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <!-- 4 → 5: Analysis to Conclusion -->
  <path d="M 315,278 Q 270,240 278,175" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowYellow)"/>
  <!-- 5 → 1: Conclusion back to Question -->
  <path d="M 295,145 Q 310,90 375,78" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- "New questions emerge" label on the 5→1 arrow -->
  <text x="310" y="98" text-anchor="middle" font-size="8" fill="#ef4444" font-style="italic">New questions</text>
  <text x="310" y="108" text-anchor="middle" font-size="8" fill="#ef4444" font-style="italic">emerge</text>

  <!-- Step 1: Question (blue) — top center -->
  <g transform="translate(400, 75)">
    <rect x="-58" y="-22" width="116" height="44" rx="10" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#60a5fa">1. Question</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">What do I want to learn?</text>
  </g>

  <!-- Step 2: Hypothesis (purple) — top right -->
  <g transform="translate(514, 158)">
    <rect x="-62" y="-22" width="124" height="44" rx="10" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#a855f7">2. Hypothesis</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">What do I expect to find?</text>
  </g>

  <!-- Step 3: Experiment (green) — bottom right -->
  <g transform="translate(470, 292)">
    <rect x="-72" y="-22" width="144" height="44" rx="10" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#4ade80">3. Experiment</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Controlled, reproducible setup</text>
  </g>

  <!-- Step 4: Analysis (yellow) — bottom left -->
  <g transform="translate(330, 292)">
    <rect x="-65" y="-22" width="130" height="44" rx="10" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">4. Analysis</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">What do the data show?</text>
  </g>

  <!-- Step 5: Conclusion (red) — top left -->
  <g transform="translate(286, 158)">
    <rect x="-65" y="-22" width="130" height="44" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">5. Conclusion</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Was I right? What's next?</text>
  </g>

  <!-- Center text -->
  <g transform="translate(400, 190)">
    <text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="600" fill="#e2e8f0">Reproducibility is key:</text>
    <text x="0" y="5" text-anchor="middle" font-size="8" fill="#94a3b8">same model + same seed</text>
    <text x="0" y="17" text-anchor="middle" font-size="8" fill="#94a3b8">+ same context = same result</text>
  </g>

  <!-- Bottom insight box -->
  <g transform="translate(40, 338)">
    <rect x="0" y="0" width="720" height="32" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="13" text-anchor="middle" font-size="9" fill="#e2e8f0">The best research questions come from surprising results.</text>
    <text x="360" y="26" text-anchor="middle" font-size="9" font-weight="600" fill="#fbbf24">If everything matches your hypothesis, dig deeper.</text>
  </g>
</svg>