<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgCycle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4ade80"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="800" height="460" rx="16" fill="url(#bgCycle)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">The Research Cycle</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#94a3b8">Good research is systematic, reproducible, and honest</text>

  <!-- Cycle center at 400, 235. Radius ~160 for wide spacing -->
  <!-- Step 1 (top):         400, 75  -->
  <!-- Step 2 (top-right):   552, 183 -->
  <!-- Step 3 (bottom-right):494, 335 -->
  <!-- Step 4 (bottom-left): 306, 335 -->
  <!-- Step 5 (top-left):    248, 183 -->

  <!-- Connecting arrows -->
  <path d="M 460,82 Q 530,100 540,170" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 570,205 Q 580,280 510,325" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 470,345 Q 400,370 340,345" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 280,320 Q 225,280 240,205" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <path d="M 260,168 Q 290,100 350,82" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- "New questions emerge" label -->
  <text x="260" y="120" text-anchor="middle" font-size="9" fill="#ef4444" font-style="italic">New questions</text>
  <text x="260" y="132" text-anchor="middle" font-size="9" fill="#ef4444" font-style="italic">emerge</text>

  <!-- Step 1: Question (blue) — top center -->
  <g transform="translate(400, 78)">
    <rect x="-68" y="-26" width="136" height="52" rx="12" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#60a5fa">1. Question</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#94a3b8">What do I want to learn?</text>
  </g>

  <!-- Step 2: Hypothesis (purple) — top right -->
  <g transform="translate(555, 186)">
    <rect x="-72" y="-26" width="144" height="52" rx="12" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#a855f7">2. Hypothesis</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#94a3b8">What do I expect to find?</text>
  </g>

  <!-- Step 3: Experiment (green) — bottom right -->
  <g transform="translate(494, 338)">
    <rect x="-82" y="-26" width="164" height="52" rx="12" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">3. Experiment</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#94a3b8">Controlled, reproducible setup</text>
  </g>

  <!-- Step 4: Analysis (yellow) — bottom left -->
  <g transform="translate(306, 338)">
    <rect x="-72" y="-26" width="144" height="52" rx="12" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">4. Analysis</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#94a3b8">What do the data show?</text>
  </g>

  <!-- Step 5: Conclusion (red) — top left -->
  <g transform="translate(248, 186)">
    <rect x="-72" y="-26" width="144" height="52" rx="12" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444">5. Conclusion</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#94a3b8">Was I right? What's next?</text>
  </g>

  <!-- Center text -->
  <g transform="translate(400, 230)">
    <text x="0" y="-10" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">Reproducibility is key:</text>
    <text x="0" y="6" text-anchor="middle" font-size="10" fill="#94a3b8">same model + same seed</text>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="#94a3b8">+ same context = same result</text>
  </g>

  <!-- Bottom insight box -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="720" height="38" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="15" text-anchor="middle" font-size="10" fill="#e2e8f0">The best research questions come from surprising results.</text>
    <text x="360" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">If everything matches your hypothesis, dig deeper.</text>
  </g>
</svg>
