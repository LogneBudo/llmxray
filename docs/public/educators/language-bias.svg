<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Tokenizer Language Bias</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">Same meaning, different token counts across languages</text>

  <!-- Sentence display -->
  <text x="400" y="88" text-anchor="middle" font-size="11" fill="#c084fc" font-style="italic">"The weather is beautiful today"</text>

  <!-- Chart area -->
  <g transform="translate(100, 110)">
    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="260" stroke="#334155" stroke-width="1"/>
    <!-- X axis -->
    <line x1="0" y1="260" x2="620" y2="260" stroke="#334155" stroke-width="1"/>

    <!-- Y axis labels -->
    <text x="-10" y="260" text-anchor="end" font-size="10" fill="#64748b">0</text>
    <text x="-10" y="195" text-anchor="end" font-size="10" fill="#64748b">5</text>
    <text x="-10" y="130" text-anchor="end" font-size="10" fill="#64748b">10</text>
    <text x="-10" y="65" text-anchor="end" font-size="10" fill="#64748b">15</text>
    <text x="-10" y="0" text-anchor="end" font-size="10" fill="#64748b">20</text>

    <!-- Grid lines -->
    <line x1="0" y1="195" x2="620" y2="195" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="0" y1="130" x2="620" y2="130" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="0" y1="65" x2="620" y2="65" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>

    <!-- Y axis title -->
    <text x="-45" y="130" text-anchor="middle" font-size="11" fill="#94a3b8" transform="rotate(-90, -45, 130)">Tokens</text>

    <!-- Bar: English - 5 tokens -->
    <rect x="30" y="195" width="50" height="65" rx="4" fill="#4ade80" opacity="0.8"/>
    <text x="55" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">5</text>
    <text x="55" y="280" text-anchor="middle" font-size="11" fill="#e2e8f0">English</text>
    <text x="55" y="295" text-anchor="middle" font-size="9" fill="#64748b">1.0x</text>

    <!-- Bar: French - 7 tokens -->
    <rect x="120" y="169" width="50" height="91" rx="4" fill="#a855f7" opacity="0.8"/>
    <text x="145" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#a855f7">7</text>
    <text x="145" y="280" text-anchor="middle" font-size="11" fill="#e2e8f0">French</text>
    <text x="145" y="295" text-anchor="middle" font-size="9" fill="#64748b">1.4x</text>

    <!-- Bar: German - 8 tokens -->
    <rect x="210" y="156" width="50" height="104" rx="4" fill="#8b5cf6" opacity="0.8"/>
    <text x="235" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#8b5cf6">8</text>
    <text x="235" y="280" text-anchor="middle" font-size="11" fill="#e2e8f0">German</text>
    <text x="235" y="295" text-anchor="middle" font-size="9" fill="#64748b">1.6x</text>

    <!-- Bar: Chinese - 10 tokens -->
    <rect x="300" y="130" width="50" height="130" rx="4" fill="#7c3aed" opacity="0.8"/>
    <text x="325" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">10</text>
    <text x="325" y="280" text-anchor="middle" font-size="11" fill="#e2e8f0">Chinese</text>
    <text x="325" y="295" text-anchor="middle" font-size="9" fill="#64748b">2.0x</text>

    <!-- Bar: Arabic - 12 tokens -->
    <rect x="390" y="104" width="50" height="156" rx="4" fill="#6d28d9" opacity="0.8"/>
    <text x="415" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">12</text>
    <text x="415" y="280" text-anchor="middle" font-size="11" fill="#e2e8f0">Arabic</text>
    <text x="415" y="295" text-anchor="middle" font-size="9" fill="#64748b">2.4x</text>

    <!-- Bar: Yoruba - 18 tokens -->
    <rect x="480" y="26" width="50" height="234" rx="4" fill="#ef4444" opacity="0.7"/>
    <text x="505" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444">18</text>
    <text x="505" y="280" text-anchor="middle" font-size="11" fill="#e2e8f0">Yoruba</text>
    <text x="505" y="295" text-anchor="middle" font-size="9" fill="#64748b">3.6x</text>

    <!-- Reference line at English level -->
    <line x1="30" y1="195" x2="560" y2="195" stroke="#4ade80" stroke-width="1" stroke-dasharray="6 3" opacity="0.4"/>
    <text x="575" y="199" font-size="9" fill="#4ade80" opacity="0.6">English baseline</text>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(100, 390)">
    <rect x="0" y="-12" width="600" height="28" rx="6" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
    <text x="300" y="6" text-anchor="middle" font-size="11" fill="#f87171">Same meaning costs 3.6x more tokens in Yoruba than English — higher cost, slower generation, shorter context</text>
  </g>
</svg>
