<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgCycleFr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrowBlueFr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPurpleFr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreenFr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4ade80"/>
    </marker>
    <marker id="arrowYellowFr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRedFr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="800" height="380" rx="16" fill="url(#bgCycleFr)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Le cycle de recherche</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#94a3b8">La bonne recherche est syst&#xe9;matique, reproductible et honn&#xea;te</text>

  <!-- Connecting arrows (curved paths between nodes) -->
  <!-- 1 &#x2192; 2: Question to Hypoth&#xe8;se -->
  <path d="M 430,80 Q 490,90 500,145" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlueFr)"/>
  <!-- 2 &#x2192; 3: Hypoth&#xe8;se to Exp&#xe9;rience -->
  <path d="M 525,175 Q 540,240 485,280" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurpleFr)"/>
  <!-- 3 &#x2192; 4: Exp&#xe9;rience to Analyse -->
  <path d="M 448,300 Q 400,320 355,300" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreenFr)"/>
  <!-- 4 &#x2192; 5: Analyse to Conclusion -->
  <path d="M 315,278 Q 270,240 278,175" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowYellowFr)"/>
  <!-- 5 &#x2192; 1: Conclusion back to Question -->
  <path d="M 295,145 Q 310,90 375,78" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRedFr)"/>

  <!-- "De nouvelles questions &#xe9;mergent" label on the 5&#x2192;1 arrow -->
  <text x="310" y="98" text-anchor="middle" font-size="8" fill="#ef4444" font-style="italic">De nouvelles questions</text>
  <text x="310" y="108" text-anchor="middle" font-size="8" fill="#ef4444" font-style="italic">&#xe9;mergent</text>

  <!-- Step 1: Question (blue) &#x2014; top center -->
  <g transform="translate(400, 75)">
    <rect x="-58" y="-22" width="116" height="44" rx="10" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#60a5fa">1. Question</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Que veux-je apprendre ?</text>
  </g>

  <!-- Step 2: Hypoth&#xe8;se (purple) &#x2014; top right -->
  <g transform="translate(514, 158)">
    <rect x="-62" y="-22" width="124" height="44" rx="10" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#a855f7">2. Hypoth&#xe8;se</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Que m'attends-je &#xe0; trouver ?</text>
  </g>

  <!-- Step 3: Exp&#xe9;rience (green) &#x2014; bottom right -->
  <g transform="translate(470, 292)">
    <rect x="-78" y="-22" width="156" height="44" rx="10" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#4ade80">3. Exp&#xe9;rience</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Protocole contr&#xf4;l&#xe9; et reproductible</text>
  </g>

  <!-- Step 4: Analyse (yellow) &#x2014; bottom left -->
  <g transform="translate(330, 292)">
    <rect x="-72" y="-22" width="144" height="44" rx="10" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">4. Analyse</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Que montrent les donn&#xe9;es ?</text>
  </g>

  <!-- Step 5: Conclusion (red) &#x2014; top left -->
  <g transform="translate(286, 158)">
    <rect x="-65" y="-22" width="130" height="44" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">5. Conclusion</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Avais-je raison ? Et ensuite ?</text>
  </g>

  <!-- Center text -->
  <g transform="translate(400, 190)">
    <text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="600" fill="#e2e8f0">La reproductibilit&#xe9; est essentielle :</text>
    <text x="0" y="5" text-anchor="middle" font-size="8" fill="#94a3b8">m&#xea;me mod&#xe8;le + m&#xea;me seed</text>
    <text x="0" y="17" text-anchor="middle" font-size="8" fill="#94a3b8">+ m&#xea;me contexte = m&#xea;me r&#xe9;sultat</text>
  </g>

  <!-- Bottom insight box -->
  <g transform="translate(40, 338)">
    <rect x="0" y="0" width="720" height="32" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="13" text-anchor="middle" font-size="9" fill="#e2e8f0">Les meilleures questions de recherche naissent de r&#xe9;sultats surprenants.</text>
    <text x="360" y="26" text-anchor="middle" font-size="9" font-weight="600" fill="#fbbf24">Si tout correspond &#xe0; votre hypoth&#xe8;se, creusez davantage.</text>
  </g>
</svg>