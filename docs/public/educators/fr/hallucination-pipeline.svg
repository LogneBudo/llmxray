<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgHallFr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgHallFr)"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Pourquoi les LLM hallucinent</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">Les modèles prédisent le token suivant le plus probable — ils ne recherchent pas de faits</text>

  <!-- Left: What humans assume -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="340" height="200" rx="12" fill="rgba(239,68,68,0.05)" stroke="#ef4444" stroke-width="1" stroke-dasharray="4"/>
    <text x="170" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444">Ce que les gens supposent (faux)</text>

    <rect x="20" y="45" width="130" height="50" rx="8" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1"/>
    <text x="85" y="65" text-anchor="middle" font-size="11" fill="#60a5fa">Question</text>
    <text x="85" y="80" text-anchor="middle" font-size="10" fill="#94a3b8">« Capitale de la France ? »</text>

    <line x1="155" y1="70" x2="185" y2="70" stroke="#ef4444" stroke-width="2"/>
    <polygon points="185,66 193,70 185,74" fill="#ef4444"/>

    <rect x="195" y="45" width="130" height="50" rx="8" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
    <text x="260" y="65" text-anchor="middle" font-size="11" fill="#ef4444">Base de données</text>
    <text x="260" y="80" text-anchor="middle" font-size="10" fill="#94a3b8">Chercher « Paris »</text>

    <text x="170" y="130" text-anchor="middle" font-size="10" fill="#ef4444">Cela ne se passe PAS ainsi.</text>
    <text x="170" y="148" text-anchor="middle" font-size="10" fill="#ef4444">Il n'y a pas de base de données.</text>
    <text x="170" y="166" text-anchor="middle" font-size="10" fill="#ef4444">Le modèle n'a aucune mémoire des faits.</text>

    <!-- Big X -->
    <line x1="130" y1="110" x2="210" y2="190" stroke="#ef4444" stroke-width="3" opacity="0.3"/>
    <line x1="210" y1="110" x2="130" y2="190" stroke="#ef4444" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- Right: What actually happens -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="370" height="200" rx="12" fill="rgba(74,222,128,0.05)" stroke="#4ade80" stroke-width="1"/>
    <text x="185" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">Ce qui se passe réellement</text>

    <rect x="15" y="45" width="100" height="50" rx="8" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1"/>
    <text x="65" y="65" text-anchor="middle" font-size="10" fill="#60a5fa">Contexte</text>
    <text x="65" y="80" text-anchor="middle" font-size="9" fill="#94a3b8">« Capitale de... »</text>

    <line x1="120" y1="70" x2="140" y2="70" stroke="#4ade80" stroke-width="2"/>
    <polygon points="140,66 148,70 140,74" fill="#4ade80"/>

    <rect x="150" y="40" width="100" height="60" rx="8" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1"/>
    <text x="200" y="60" text-anchor="middle" font-size="10" fill="#a855f7">Correspondance</text>
    <text x="200" y="75" text-anchor="middle" font-size="10" fill="#a855f7">de motifs</text>
    <text x="200" y="90" text-anchor="middle" font-size="9" fill="#94a3b8">P(token suivant)</text>

    <line x1="255" y1="70" x2="275" y2="70" stroke="#4ade80" stroke-width="2"/>
    <polygon points="275,66 283,70 275,74" fill="#4ade80"/>

    <rect x="285" y="45" width="70" height="50" rx="8" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
    <text x="320" y="65" text-anchor="middle" font-size="11" fill="#4ade80">« Paris »</text>
    <text x="320" y="80" text-anchor="middle" font-size="9" fill="#94a3b8">87% probable</text>

    <text x="185" y="125" text-anchor="middle" font-size="10" fill="#4ade80">Le modèle a vu « Capitale de la France »</text>
    <text x="185" y="143" text-anchor="middle" font-size="10" fill="#4ade80">suivi de « Paris » des milliers de fois</text>
    <text x="185" y="161" text-anchor="middle" font-size="10" fill="#4ade80">dans ses données d'entraînement.</text>
    <text x="185" y="185" text-anchor="middle" font-size="10" fill="#fbbf24">Pour des questions inédites, il prédit</text>
    <text x="185" y="200" text-anchor="middle" font-size="10" fill="#fbbf24">la suite « la plus probable » — même si c'est faux.</text>
  </g>
</svg>