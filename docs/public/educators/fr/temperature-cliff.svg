<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgCliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgCliff)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">La Falaise de Température</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#94a3b8">La qualité ne se dégrade pas progressivement — elle chute brutalement</text>

  <!-- Chart area -->
  <g transform="translate(100, 80)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="250" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke="#334155" stroke-width="1"/>

    <!-- Y axis labels -->
    <text x="-12" y="254" text-anchor="end" font-size="11" fill="#64748b">0%</text>
    <text x="-12" y="129" text-anchor="end" font-size="11" fill="#64748b">50%</text>
    <text x="-12" y="4" text-anchor="end" font-size="11" fill="#64748b">100%</text>
    <text x="-55" y="125" text-anchor="middle" font-size="12" fill="#94a3b8" transform="rotate(-90, -55, 125)">Taux de correction</text>

    <!-- X axis labels -->
    <text x="0" y="275" text-anchor="middle" font-size="11" fill="#64748b">0.0</text>
    <text x="100" y="275" text-anchor="middle" font-size="11" fill="#64748b">0.3</text>
    <text x="200" y="275" text-anchor="middle" font-size="11" fill="#64748b">0.5</text>
    <text x="300" y="275" text-anchor="middle" font-size="11" fill="#64748b">0.7</text>
    <text x="400" y="275" text-anchor="middle" font-size="11" fill="#64748b">1.0</text>
    <text x="500" y="275" text-anchor="middle" font-size="11" fill="#64748b">1.5</text>
    <text x="600" y="275" text-anchor="middle" font-size="11" fill="#64748b">2.0</text>
    <text x="300" y="296" text-anchor="middle" font-size="12" fill="#94a3b8">Temperature</text>

    <!-- Grid lines -->
    <line x1="0" y1="125" x2="600" y2="125" stroke="#334155" stroke-width="0.5" stroke-dasharray="4"/>

    <!-- Green zone background -->
    <rect x="0" y="0" width="340" height="250" rx="0" fill="#4ade80" opacity="0.03"/>
    <!-- Yellow zone -->
    <rect x="340" y="0" width="100" height="250" rx="0" fill="#fbbf24" opacity="0.04"/>
    <!-- Red zone -->
    <rect x="440" y="0" width="160" height="250" rx="0" fill="#ef4444" opacity="0.04"/>

    <!-- The curve: high plateau then sharp cliff -->
    <polyline
      points="0,15 50,15 100,18 150,20 200,22 250,25 300,28 320,30 340,35 360,55 370,80 380,115 390,155 400,175 420,195 450,210 500,225 550,235 600,238"
      fill="none"
      stroke="url(#lineGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Data points -->
    <circle cx="0" cy="15" r="4" fill="#4ade80"/>
    <circle cx="100" cy="18" r="4" fill="#4ade80"/>
    <circle cx="200" cy="22" r="4" fill="#4ade80"/>
    <circle cx="300" cy="28" r="4" fill="#a855f7"/>
    <circle cx="370" cy="80" r="5" fill="#fbbf24" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    <circle cx="400" cy="175" r="4" fill="#ef4444"/>
    <circle cx="500" cy="225" r="4" fill="#ef4444"/>
    <circle cx="600" cy="238" r="4" fill="#ef4444"/>

    <!-- Cliff annotation -->
    <line x1="365" y1="0" x2="365" y2="250" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="365" y="-8" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">LA FALAISE</text>

    <!-- Zone labels -->
    <text x="150" y="-8" text-anchor="middle" font-size="11" font-weight="600" fill="#4ade80">Zone Fiable</text>
    <text x="530" y="-8" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">Zone de Chaos</text>

    <!-- Annotation: plateau -->
    <rect x="30" y="40" width="180" height="40" rx="6" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="1" opacity="0.6"/>
    <text x="120" y="56" text-anchor="middle" font-size="10" fill="#4ade80">95%+ de sorties correctes</text>
    <text x="120" y="72" text-anchor="middle" font-size="10" fill="#4ade80">Résultats quasi identiques</text>

    <!-- Annotation: cliff -->
    <rect x="410" y="120" width="170" height="40" rx="6" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
    <text x="495" y="136" text-anchor="middle" font-size="10" fill="#f87171">La qualité s'effondre</text>
    <text x="495" y="152" text-anchor="middle" font-size="10" fill="#f87171">Les hallucinations augmentent</text>
  </g>
</svg>