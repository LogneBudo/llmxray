<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="pulseGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#a855f7" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Large ambient glow behind icon -->
  <circle cx="640" cy="240" r="200" fill="#a855f7" opacity="0.06"/>
  <circle cx="640" cy="240" r="120" fill="#7c3aed" opacity="0.08"/>

  <!-- === FAVICON ICON (centered, scaled up) === -->
  <g transform="translate(576, 150) scale(1.0)">
    <!-- Chip outline -->
    <rect x="34" y="34" width="60" height="60" rx="6" fill="none" stroke="url(#chipStroke)" stroke-width="2.5" opacity="0.55"/>

    <!-- Chip pins — top -->
    <g stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
      <line x1="50" y1="22" x2="50" y2="34"/>
      <line x1="64" y1="18" x2="64" y2="34"/>
      <line x1="78" y1="22" x2="78" y2="34"/>
    </g>
    <!-- Chip pins — bottom -->
    <g stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
      <line x1="50" y1="94" x2="50" y2="106"/>
      <line x1="64" y1="94" x2="64" y2="110"/>
      <line x1="78" y1="94" x2="78" y2="106"/>
    </g>
    <!-- Chip pins — left -->
    <g stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
      <line x1="22" y1="50" x2="34" y2="50"/>
      <line x1="18" y1="64" x2="34" y2="64"/>
      <line x1="22" y1="78" x2="34" y2="78"/>
    </g>
    <!-- Chip pins — right -->
    <g stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
      <line x1="94" y1="50" x2="106" y2="50"/>
      <line x1="94" y1="64" x2="110" y2="64"/>
      <line x1="94" y1="78" x2="106" y2="78"/>
    </g>

    <!-- Grid inside chip -->
    <g stroke="#a855f7" stroke-width="0.5" opacity="0.08">
      <line x1="38" y1="44" x2="90" y2="44"/><line x1="38" y1="54" x2="90" y2="54"/>
      <line x1="38" y1="74" x2="90" y2="74"/><line x1="38" y1="84" x2="90" y2="84"/>
      <line x1="48" y1="36" x2="48" y2="92"/><line x1="58" y1="36" x2="58" y2="92"/>
      <line x1="68" y1="36" x2="68" y2="92"/><line x1="78" y1="36" x2="78" y2="92"/>
    </g>

    <!-- Circuit traces -->
    <g stroke="#c084fc" stroke-width="1" opacity="0.15" stroke-linecap="round">
      <polyline points="44,44 56,44 56,52" fill="none"/>
      <polyline points="72,44 84,44 84,52" fill="none"/>
      <polyline points="44,84 56,84 56,76" fill="none"/>
      <polyline points="72,84 84,84 84,76" fill="none"/>
    </g>

    <!-- Pulse glow -->
    <polyline
      points="12,64 32,64 40,64 47,48 52,76 57,38 63,82 69,42 75,78 81,50 88,64 96,64 116,64"
      fill="none" stroke="#a855f7" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round"
      opacity="0.15" filter="url(#pulseGlow)"
    />
    <!-- Main pulse -->
    <polyline
      points="12,64 32,64 40,64 47,48 52,76 57,38 63,82 69,42 75,78 81,50 88,64 96,64 116,64"
      fill="none" stroke="url(#pulse)" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"
    />
    <!-- Pulse dot -->
    <circle cx="116" cy="64" r="4" fill="#c084fc" opacity="0.4"/>
    <circle cx="116" cy="64" r="2.5" fill="#e9d5ff"/>
  </g>

  <!-- === PROJECT NAME === -->
  <!-- Glow behind text -->
  <text x="640" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#a855f7" opacity="0.15" filter="url(#textGlow)">LLMxRay</text>
  <!-- Main text -->
  <text x="640" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800">
    <tspan fill="#f1f5f9">LLM</tspan><tspan fill="#a855f7" font-family="'Courier New', monospace">xR</tspan><tspan fill="#f1f5f9">ay</tspan>
  </text>

  <!-- === TAGLINE === -->
  <text x="640" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" font-weight="400">
    Local LLM Observatory
  </text>

  <!-- === SUBTITLE === -->
  <text x="640" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" font-weight="300">
    See what your AI is actually doing — token by token, layer by layer.
  </text>

  <!-- === BOTTOM PILLS === -->
  <!-- Vue pill -->
  <rect x="370" y="530" width="80" height="28" rx="14" fill="#42b883" opacity="0.15"/>
  <text x="410" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#42b883" font-weight="500">Vue 3</text>

  <!-- TypeScript pill -->
  <rect x="470" y="530" width="110" height="28" rx="14" fill="#3178c6" opacity="0.15"/>
  <text x="525" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3178c6" font-weight="500">TypeScript</text>

  <!-- Ollama pill -->
  <rect x="600" y="530" width="85" height="28" rx="14" fill="#f1f5f9" opacity="0.1"/>
  <text x="642" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Ollama</text>

  <!-- Free pill -->
  <rect x="705" y="530" width="65" height="28" rx="14" fill="#4ade80" opacity="0.15"/>
  <text x="737" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4ade80" font-weight="500">Free</text>

  <!-- Local pill -->
  <rect x="790" y="530" width="70" height="28" rx="14" fill="#c084fc" opacity="0.15"/>
  <text x="825" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c084fc" font-weight="500">Local</text>

  <!-- Subtle border -->
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.1"/>
</svg>
